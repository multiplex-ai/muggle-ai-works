name: Resolve Claude subscription token
description: >-
  Probe the subscription tokens in order — primary, fallback, third — and export
  the first one that authenticates as CLAUDE_CODE_OAUTH_TOKEN for every later
  step in the job.

inputs:
  primary-token:
    description: Preferred subscription token, from the CLAUDE_CODE_OAUTH_TOKEN secret.
    required: true
  fallback-token:
    description: >-
      Token tried when the primary is rejected, from the CLAUDE_CODE_OAUTH_TOKEN_2
      secret. Leave unset to run single-token — resolution then behaves exactly
      like the primary-only preflight it replaces.
    required: false
    default: ""
  third-token:
    description: >-
      Token tried when the primary and fallback are both rejected, from the
      CLAUDE_CODE_OAUTH_TOKEN_3 secret. Optional; unset tokens are skipped.
    required: false
    default: ""

outputs:
  slot:
    description: "Which token authenticated: `primary`, `fallback` or `third`."
    value: ${{ steps.probe.outputs.slot }}

runs:
  using: composite
  steps:
    - id: probe
      shell: bash
      env:
        PRIMARY_TOKEN: ${{ inputs.primary-token }}
        FALLBACK_TOKEN: ${{ inputs.fallback-token }}
        THIRD_TOKEN: ${{ inputs.third-token }}
      run: |
        set -uo pipefail
        : "${CLAUDE_CONFIG_DIR:?the calling job must set CLAUDE_CONFIG_DIR to a writable path}"
        mkdir -p "$CLAUDE_CONFIG_DIR"
        # A pay-per-use key outranks the subscription token, so leaving one set
        # would bill the API and make the probe pass on the wrong credential.
        unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN

        # Any non-zero exit counts as unusable, not just a rejected token:
        # a throttled token (a spent weekly limit) should hand off to the next
        # the same way an expired one does, and both are indistinguishable from this side.
        probe_token() {
          CLAUDE_CODE_OAUTH_TOKEN="$1" claude -p 'Respond with exactly: OK' --max-turns 1 2>&1
        }

        if [ -z "$PRIMARY_TOKEN" ]; then
          echo "::error::No CLAUDE_CODE_OAUTH_TOKEN repo secret is set. Generate one with \`claude setup-token\` and add it before running skill evals." >&2
          exit 1
        fi

        slots=(primary fallback third)
        secret_names=(CLAUDE_CODE_OAUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN_2 CLAUDE_CODE_OAUTH_TOKEN_3)
        tokens=("$PRIMARY_TOKEN" "$FALLBACK_TOKEN" "$THIRD_TOKEN")
        rejected=()
        rejection_output=""
        for index in "${!tokens[@]}"; do
          [ -n "${tokens[$index]}" ] || continue
          if probe_output="$(probe_token "${tokens[$index]}")"; then
            echo "auth ok on ${secret_names[$index]}"
            if [ "${#rejected[@]}" -gt 0 ]; then
              # Surfaced loudly rather than silently absorbed: the run is healthy,
              # but the rejected tokens need regenerating before this one runs out too.
              echo "::warning title=Claude token rejected::${rejected[*]} rejected; fell back to ${secret_names[$index]}. This run is unaffected, but regenerate the rejected token(s) with \`claude setup-token\`."
              printf '%b' "$rejection_output"
            fi
            echo "slot=${slots[$index]}" >> "$GITHUB_OUTPUT"
            echo "CLAUDE_CODE_OAUTH_TOKEN=${tokens[$index]}" >> "$GITHUB_ENV"
            exit 0
          fi
          rejected+=("${secret_names[$index]}")
          rejection_output+="${secret_names[$index]} output:\n${probe_output}\n"
        done

        echo "::error::Subscription auth failed on every configured token (${rejected[*]}). Regenerate them with \`claude setup-token\` and re-set the secrets (no trailing newline), or add CLAUDE_CODE_OAUTH_TOKEN_2 / _3 from an account with quota." >&2
        printf '%b' "$rejection_output" >&2
        exit 1
