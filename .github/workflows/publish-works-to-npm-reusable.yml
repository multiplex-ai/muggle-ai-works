name: Publish Works to npm (reusable)

# Shared verification and packaging for both publish pipelines. Everything up to
# and including the smoke install lives here; the publish job itself does NOT,
# and deliberately so.
#
# npm trusted publishing binds to the *calling* workflow's filename, so each
# pipeline owns its own publish job under its own filename. Moving publish in
# here would give both channels one identity and break the production
# configuration that npmjs.com already trusts.
#
# See publish-works-to-npm.yml for the full trusted-publishing notes.

on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.1). Leave empty to auto-increment from package.json."
        required: false
        type: string
      bump:
        description: "Bump type when version is empty"
        required: false
        default: patch
        type: string
      channel:
        description: "Release channel this build is baked for: production or staging."
        required: true
        type: string
    outputs:
      package_tarball:
        description: "Filename of the packed tarball, uploaded as the npm-package artifact."
        value: ${{ jobs.package-audit.outputs.package_tarball }}

env:
  # Opt into Node.js 22 for GitHub Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE22: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint:check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify electron release checksums
        run: pnpm run verify:electron-release-checksums

  package-audit:
    runs-on: ubuntu-latest
    needs:
      - verify
    outputs:
      package_tarball: ${{ steps.pack.outputs.package_tarball }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          RELEASE_BUILD_ID: run-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_TIME: ${{ github.event.repository.updated_at }}
          # Inlined into dist/ at build time by tsup `define`. Sourced from the
          # repo secret. Without this, client telemetry from the published
          # package is a silent no-op on every end-user machine.
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: pnpm run build

      - name: Verify telemetry connection string was inlined
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          // tsup `define` can place the substituted literal into any chunk
          // reachable from the entrypoints, so scan all JS files under dist/.
          function walk(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(full));
              else if (entry.isFile() && entry.name.endsWith(".js")) out.push(full);
            }
            return out;
          }
          const files = walk("dist");
          const hit = files.some((f) => fs.readFileSync(f, "utf-8").includes("IngestionEndpoint="));
          if (!hit) {
            throw new Error(
              "AppInsights connection string was not inlined into dist/. " +
              "Set the APPLICATIONINSIGHTS_CONNECTION_STRING repository secret " +
              "and re-run. Without it, the published package emits no client telemetry."
            );
          }
          NODE

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: extract_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set package version (tag trigger)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
          else
            echo "Version already at $VERSION, skipping"
          fi

      - name: Set package version (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            CURRENT=$(node -p "require('./package.json').version")
            if [ "$CURRENT" != "$INPUT_VERSION" ]; then
              npm version "$INPUT_VERSION" --no-git-tag-version
            else
              echo "package.json already at $INPUT_VERSION, skipping npm version"
            fi
          else
            npm version "$INPUT_BUMP" --no-git-tag-version
          fi

      - name: Apply staging pre-release version
        if: ${{ inputs.channel == 'staging' }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE=$(node -p "require('./package.json').version")
          npm version "${BASE%%-*}-staging.${RUN_NUMBER}" --no-git-tag-version

      - name: Set runtime target to match the channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: npm pkg set muggleConfig.runtimeTargetDefault="$CHANNEL"

      - name: Fail on stale mcp folder references
        run: |
          node <<'NODE'
          const fs = require("fs");
          const files = ["package.json", "pnpm-lock.yaml"];
          for (const file of files) {
            const text = fs.readFileSync(file, "utf-8");
            if (text.includes("file:packages/mcp\"") || text.includes("link:packages/mcp\"") || text.includes("\"packages/mcp\"")) {
              throw new Error(`Found stale packages/mcp reference in ${file}`);
            }
          }
          NODE

      - name: Pack npm package
        id: pack
        run: |
          npm pkg delete scripts.prepare
          npm pkg delete devDependencies.@muggleai/telemetry
          npm pack --json > pack-result.json
          PACKAGE_TARBALL=$(node -e "const output=require('./pack-result.json');if(!Array.isArray(output)||output.length!==1){throw new Error('Unexpected npm pack output');}process.stdout.write(output[0].filename);")
          echo "package_tarball=$PACKAGE_TARBALL" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_TARBALL=$PACKAGE_TARBALL" >> "$GITHUB_ENV"

      - name: Validate package contents
        run: |
          node <<'NODE'
          const cp = require("child_process");
          const fs = require("fs");
          const tarball = process.env.PACKAGE_TARBALL;
          const listing = cp.execSync(`tar -tf ${tarball}`, { encoding: "utf-8" }).split("\n").filter(Boolean);
          const required = ["package/dist/cli.js", "package/bin/muggle.js", "package/scripts/postinstall.mjs", "package/plugin/.claude-plugin/plugin.json", "package/plugin/.cursor-plugin/plugin.json"];
          for (const entry of required) {
            if (!listing.includes(entry)) {
              throw new Error(`Missing ${entry} in ${tarball}`);
            }
          }
          const cliBin = fs.readFileSync("bin/muggle.js", "utf-8");
          if (!cliBin.includes("../dist/cli.js")) {
            throw new Error("bin/muggle.js must import ../dist/cli.js");
          }
          NODE

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.package_tarball }}
          if-no-files-found: error

  smoke-install:
    needs:
      - package-audit
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package

      - name: Install tarball globally
        shell: bash
        run: |
          PACKAGE_TARBALL="${{ needs.package-audit.outputs.package_tarball }}"
          npm install -g "./${PACKAGE_TARBALL}"

      - name: Verify CLI is executable
        shell: bash
        run: |
          muggle --version
          muggle doctor

      # A staging-targeted tarball reaching the latest dist-tag points every
      # ordinary install at a backend the user has no account on, and nothing
      # about the failure says why. Catch it before publish, not after.
      - name: Assert the baked runtime target matches the channel
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          ACTUAL=$(muggle status | sed -n 's/^Runtime target: //p')
          if [ "$ACTUAL" != "$CHANNEL" ]; then
            echo "Baked runtime target '$ACTUAL' does not match requested channel '$CHANNEL'."
            exit 1
          fi
          echo "Runtime target '$ACTUAL' matches channel '$CHANNEL'."

  # Publishes via OIDC trusted publishing — see top-of-file note when renaming
  # this workflow or the workflow display name.