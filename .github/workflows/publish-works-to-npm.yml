name: Publish Works to npm

# -----------------------------------------------------------------------------
# This is the PRODUCTION publish pipeline. Its filename and `name:` are load-
# bearing — do not rename either, and do not move the publish job below into the
# shared workflow:
# - npmjs.com → package → Access → Trusted Publishing / automation: the allowed
#   GitHub workflow is tied to the workflow *filename* (and sometimes display
#   name). npm matches the calling workflow, so the publish job must stay here
#   rather than in publish-works-to-npm-reusable.yml, which both channels share.
# - GitHub → Settings → Environments → `npm-publish`: confirm the environment
#   exists and OIDC trusted publishing is configured on npmjs.com.
#   Auth is handled via OIDC (id-token: write), not via NPM_TOKEN.
# - Do not remove the publish job step that upgrades npm to 11.x (see that job below).
#   Node 22 images ship npm 10.x; trusted publishing / OIDC needs npm >= 11.5.1.
#   Corepack doesn't manage npm (only yarn/pnpm), so we use `npm install -g npm@11.5.1`.
#   See: https://docs.npmjs.com/trusted-publishers
#
# Everything before publishing — verify, package audit, smoke install — lives in
# publish-works-to-npm-reusable.yml and is shared with the staging pipeline.
# -----------------------------------------------------------------------------

run-name: >-
  Publish Works to npm (
  ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name
  || (github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.version)
  || (github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.bump))
  || 'auto-next-patch' }}
  )

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.1). Leave empty to auto-increment from package.json."
        required: false
        type: string
      bump:
        description: "Bump type when version is empty (patch=1.0.9→1.0.10, minor=1.0.9→1.1.0, major=1.0.9→2.0.0)"
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

env:
  # Opt into Node.js 22 for GitHub Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE22: true

jobs:
  build:
    uses: ./.github/workflows/publish-works-to-npm-reusable.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      bump: ${{ inputs.bump || 'patch' }}
      channel: production

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade to npm 11 (required for OIDC)
        run: npm install -g npm@11.5.1

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package

      - name: Remove token auth line so npm uses OIDC
        run: sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"

      - name: Publish to npm (with provenance via OIDC)
        env:
          PACKAGE_TARBALL: ${{ needs.build.outputs.package_tarball }}
        run: npm publish "$PACKAGE_TARBALL" --access public --provenance

  # TODO: Add publish-mcp-registry job when mcp-publisher CLI is publicly available.
  # The official MCP registry (modelcontextprotocol.io) is in preview and the CLI
  # tooling is not yet distributed via npm. Until then, publish manually:
  #   mcp-publisher login github
  #   mcp-publisher publish

  notify-on-failure:
    runs-on: ubuntu-latest
    needs:
      - build
      - publish
    if: failure()
    steps:
      - name: Notify failure
        run: echo "Works production publish failed. Check the workflow logs."
