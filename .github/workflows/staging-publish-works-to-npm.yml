name: Publish Works to npm (staging)

# -----------------------------------------------------------------------------
# This is the STAGING publish pipeline. It bakes the staging runtime target,
# versions the package as a pre-release, and publishes under the `staging`
# dist-tag, leaving `latest` untouched.
#
# BEFORE THE FIRST RUN: npmjs.com → @muggleai/works → Access → Trusted Publishing
# must list THIS workflow filename alongside publish-works-to-npm.yml. npm binds
# trusted publishing to the calling workflow's filename, so a pipeline it does
# not know about fails at the publish step with ENEEDAUTH. The verify, package
# and smoke-install jobs all pass first, so the failure lands at the very end.
#
# Everything before publishing is shared with the production pipeline in
# publish-works-to-npm-reusable.yml. The publish job stays here rather than in
# the shared workflow precisely because npm matches on the caller.
# -----------------------------------------------------------------------------

run-name: >-
  Publish Works to npm — staging (
  ${{ (github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.version)
  || format('manual-{0}', inputs.bump) }}
  )

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base version for the pre-release (e.g., 1.0.1). Leave empty to auto-increment from package.json."
        required: false
        type: string
      bump:
        description: "Bump type when version is empty (patch=1.0.9→1.0.10, minor=1.0.9→1.1.0, major=1.0.9→2.0.0)"
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

env:
  # Opt into Node.js 22 for GitHub Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE22: true

jobs:
  build:
    uses: ./.github/workflows/publish-works-to-npm-reusable.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      bump: ${{ inputs.bump || 'patch' }}
      channel: staging

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade to npm 11 (required for OIDC)
        run: npm install -g npm@11.5.1

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package

      - name: Remove token auth line so npm uses OIDC
        run: sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"

      - name: Publish to npm under the staging dist-tag
        env:
          PACKAGE_TARBALL: ${{ needs.build.outputs.package_tarball }}
        run: npm publish "$PACKAGE_TARBALL" --access public --provenance --tag staging

      - name: Confirm latest was not moved
        run: |
          DIST_TAGS=$(npm view @muggleai/works dist-tags --json)
          echo "$DIST_TAGS"
          node -e "
            const tags = JSON.parse(process.argv[1]);
            if (!tags.staging) { throw new Error('staging dist-tag was not set'); }
            if (tags.latest === tags.staging) {
              throw new Error('latest now points at the staging build: ' + tags.latest);
            }
          " "$DIST_TAGS"

  notify-on-failure:
    runs-on: ubuntu-latest
    needs:
      - build
      - publish
    if: failure()
    steps:
      - name: Notify failure
        run: echo "Works staging publish failed. Check the workflow logs."
