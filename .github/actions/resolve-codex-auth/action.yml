name: Resolve Codex auth
description: >-
  Pick the credential the Codex evals run on: an OpenAI API key, exported as
  CODEX_API_KEY, or a ChatGPT-subscription login, written to a private
  auth.json whose path is exported as CODEX_AUTH_FILE for seed-home.sh to copy
  into each Codex home. Neither set reports not ready, so the job skips.

inputs:
  api-key:
    description: Pay-per-use OpenAI API key, from the OPENAI_API_KEY secret.
    required: false
    default: ""
  subscription-auth-json:
    description: >-
      Contents of a `codex login` auth.json (auth_mode chatgpt), from the
      CODEX_AUTH_JSON secret. Used only when no API key is set.
    required: false
    default: ""

outputs:
  ready:
    description: "`true` when a credential was resolved."
    value: ${{ steps.resolve.outputs.ready }}
  method:
    description: "`api-key`, `subscription`, or empty when not ready."
    value: ${{ steps.resolve.outputs.method }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        OPENAI_API_KEY_INPUT: ${{ inputs.api-key }}
        SUBSCRIPTION_AUTH_JSON: ${{ inputs.subscription-auth-json }}
      run: |
        set -euo pipefail
        if [ -n "$OPENAI_API_KEY_INPUT" ]; then
          echo "CODEX_API_KEY=$OPENAI_API_KEY_INPUT" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "method=api-key" >> "$GITHUB_OUTPUT"
          echo "Codex auth: OpenAI API key."
        elif [ -n "$SUBSCRIPTION_AUTH_JSON" ]; then
          auth_file="${RUNNER_TEMP:?}/codex-auth.json"
          (umask 077 && printf '%s' "$SUBSCRIPTION_AUTH_JSON" > "$auth_file")
          # A malformed paste would otherwise surface as an opaque login failure
          # inside every eval session.
          if ! node -e 'const a = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!a.tokens || !a.tokens.refresh_token) process.exit(1)' "$auth_file"; then
            echo "::error title=CODEX_AUTH_JSON unusable::The secret is not a codex login auth.json with tokens. Re-upload it from ~/.codex/auth.json after \`codex login\`." >&2
            exit 1
          fi
          echo "CODEX_AUTH_FILE=$auth_file" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "method=subscription" >> "$GITHUB_OUTPUT"
          echo "Codex auth: ChatGPT subscription login."
        else
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "method=" >> "$GITHUB_OUTPUT"
        fi
