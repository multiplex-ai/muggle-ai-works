name: Skill Evals

# Blocking on every PR to master: the gate eval (behavioral preference-gate
# contract) and the routing eval (skill descriptions route the right queries).
# Both are LLM-driven, so the per-PR routing run is scoped to the skills the PR
# touches; the full 391-query routing sweep runs nightly and on demand.
#
# The `run-full-eval` label forces the full gate + routing suite on any PR — even
# one that changes only runtime and touches no skill/gate file (which the change
# detection would skip). The on-demand lever for de-risking a refactor that alters
# how skills are delivered but not their definitions.
on:
  pull_request:
    branches: [master]
    # Re-declaring the defaults keeps opened/synchronize/reopened; `labeled` lets
    # the run-full-eval label force the full suite (each job's scope step reads it).
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      gate_runs:
        description: "skill-gate-eval: runs per scenario"
        default: "10"
      gate_concurrency:
        description: "skill-gate-eval: parallel reps per gate"
        default: "8"
      routing_runs:
        description: "skill-routing-eval: runs per query (full sweep)"
        default: "3"
      routing_runs_scoped:
        description: "skill-routing-eval: runs per query (scoped PR run)"
        default: "5"
      routing_workers:
        description: "skill-routing-eval: parallel sessions across the pooled sweep"
        default: "12"
      agent_runs:
        description: "agent-gate-eval: runs per scenario"
        default: "5"
      agent_concurrency:
        description: "agent-gate-eval: parallel reps per agent"
        default: "8"

concurrency:
  group: skill-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Post the eval results back to the PR as a sticky comment.
  pull-requests: write

jobs:
  skill-gate-eval:
    runs-on: ubuntu-latest
    # LLM-driven: every gate × every scenario × GATE_RUNS real Claude reps
    # (~1 min each). Reps run GATE_CONCURRENCY-wide with throttle backoff
    # (run.ts); gates stay sequential so ::group:: logs stay attributable.
    # Budget kept generous — throttling can serialize a run back down.
    timeout-minutes: 180
    env:
      GATE_RUNS: ${{ inputs.gate_runs || '10' }}
      GATE_CONCURRENCY: ${{ inputs.gate_concurrency || '8' }}
      MUGGLE_BRAIN_DIR: ${{ github.workspace }}/muggle-ai-brain
      # Fresh, writable config dir for the headless Claude Code CLI (same as
      # skill-routing-eval) — avoids first-run state in an unwritable HOME.
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/.cc-config
    steps:
      # Fail fast with a clear reason if setup is incomplete, rather than a
      # cryptic git-auth error deep in the scenario-repo checkout.
      - name: Require secrets
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRAIN_REPO_TOKEN: ${{ secrets.BRAIN_REPO_TOKEN }}
        run: |
          : "${CLAUDE_CODE_OAUTH_TOKEN:?set the CLAUDE_CODE_OAUTH_TOKEN repo secret (run \`claude setup-token\`) to run skill evals}"
          : "${BRAIN_REPO_TOKEN:?set the BRAIN_REPO_TOKEN repo secret (read access to multiplex-ai/muggle-ai-brain)}"

      - name: Checkout works
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The gate suite is LLM-driven and slow. On a PR, scope it to what the diff
      # can actually affect. A gate runs the skill's body under its configured
      # `model:`, so gate behavior shifts when either the gate content OR the
      # model changes:
      #   - harness / preference-gates / any non-SKILL.md skill file, or a
      #     non-`model:` SKILL.md line → full suite (scope unknown).
      #   - ONLY the `model:` line changed → the gate still runs, but scoped to
      #     that skill: a cheaper model may mishandle the contract, so its gate
      #     must re-run under the new model — while unrelated gates need not.
      #   - docs-only / nothing skill-relevant → skip.
      # `skills` is the scoped list (empty = full suite). Non-PR events run full.
      - name: Determine scope
        id: scope
        env:
          RUN_FULL_EVAL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-eval') }}
        run: |
          set -euo pipefail
          # The run-full-eval label runs the whole gate suite regardless of what
          # the PR changed — the change detection below skips runtime-only PRs.
          if [ "$RUN_FULL_EVAL" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skills=" >> "$GITHUB_OUTPUT"
            echo "Full gate sweep (run-full-eval label)"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skills=" >> "$GITHUB_OUTPUT"
            echo "Full gate sweep (event: ${{ github.event_name }})"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          full=false
          model_only=""
          if git diff --name-only "$base...HEAD" -- internal/skill-gate-eval/ | grep -q .; then
            full=true
          else
            for s in $(git diff --name-only "$base...HEAD" -- plugin/skills/ | awk -F/ 'NF>=4{print $3}' | sort -u); do
              # any non-SKILL.md file in the skill dir is gate-relevant with unknown scope
              if git diff --name-only "$base...HEAD" -- "plugin/skills/$s/" | grep -qvE '/SKILL\.md$'; then full=true; break; fi
              d="$(git diff -U0 "$base...HEAD" -- "plugin/skills/$s/SKILL.md" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' || true)"
              [ -z "$d" ] && continue
              # a non-`model:` SKILL.md line (gate body) changed → full suite
              if printf '%s\n' "$d" | grep -qvE '^[+-]model:[[:space:]]'; then full=true; break; fi
              # only the `model:` line changed → re-run this skill's gate, scoped
              if printf '%s\n' "$d" | grep -qE '^[+-]model:[[:space:]]'; then model_only="${model_only:+$model_only,}$s"; fi
            done
          fi
          if $full; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skills=" >> "$GITHUB_OUTPUT"
            echo "Gate-relevant changes detected — running full gate suite."
          elif [ -n "$model_only" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skills=$model_only" >> "$GITHUB_OUTPUT"
            echo "Model-only change — gate eval scoped to: $model_only"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No gate-relevant changes (docs) — gate eval not required."
          fi

      # Scenario data lives in a separate private repo; needs a token with read
      # access to multiplex-ai/muggle-ai-brain (the default GITHUB_TOKEN cannot
      # read other private repos).
      - name: Checkout scenario data (muggle-ai-brain)
        if: steps.scope.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          repository: multiplex-ai/muggle-ai-brain
          token: ${{ secrets.BRAIN_REPO_TOKEN }}
          path: muggle-ai-brain

      - name: Setup Node.js
        if: steps.scope.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        if: steps.scope.outputs.should_run == 'true'
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        if: steps.scope.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      # The gate harness drives @anthropic-ai/claude-agent-sdk's query(), which
      # needs the Claude Code CLI; the SDK's bundled native binary isn't usable
      # on the runner. Install it (as skill-routing-eval does) and let the run
      # step point the SDK at it. Auth stays on the subscription token.
      - name: Install Claude Code CLI
        if: steps.scope.outputs.should_run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Prove a subscription token authenticates before the agent-SDK harness
      # runs, via the same `claude -p` path skill-routing-eval relies on. A
      # rejected token and an SDK/harness fault otherwise both surface only as
      # the SDK's opaque "process exited with code 1"; resolving here separates
      # them, and hands off to the spare token when the primary is unusable.
      - name: Resolve subscription auth
        if: steps.scope.outputs.should_run == 'true'
        uses: ./.github/actions/resolve-claude-token
        with:
          primary-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          fallback-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}

      - name: Run skill-gate evals (every gate in the scenario repo)
        if: steps.scope.outputs.should_run == 'true'
        env:
          # Empty = full suite; a comma-list scopes the run to those skills' gates
          # (a model-only PR — see Determine scope).
          SCOPE_SKILLS: ${{ steps.scope.outputs.skills }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Keep a stray API key from outranking the subscription token (it would bill the API).
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          # The SDK can't find its bundled native binary on the runner; point it
          # at the globally-installed CLI instead.
          export CLAUDE_CODE_EXECUTABLE="$(command -v claude)"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          fail=0
          total=0
          ran=0
          for scenarios in "$MUGGLE_BRAIN_DIR"/eval/skill-gate-eval/*/scenarios.json; do
            total=$((total + 1))
            gate="$(basename "$(dirname "$scenarios")")"
            skill="$(node -e "process.stdout.write(require(process.argv[1]).skill)" "$scenarios")"
            if [ -n "$SCOPE_SKILLS" ]; then
              case ",$SCOPE_SKILLS," in
                *",$skill,"*) : ;;
                *) echo "skip gate=$gate (skill=$skill not in scope: $SCOPE_SKILLS)"; continue ;;
              esac
            fi
            echo "::group::gate=$gate skill=$skill runs=$GATE_RUNS"
            if pnpm exec tsx internal/skill-gate-eval/src/run.ts \
                 --gate "$gate" --skill "$skill" --runs "$GATE_RUNS" \
                 --concurrency "$GATE_CONCURRENCY" \
                 --brain-dir "$MUGGLE_BRAIN_DIR"; then
              echo "PASS $gate"
            else
              echo "FAIL $gate"
              fail=1
            fi
            ran=$((ran + 1))
            echo "::endgroup::"
          done
          if [ "$total" -eq 0 ]; then
            echo "No scenarios.json found under $MUGGLE_BRAIN_DIR/eval/skill-gate-eval" >&2
            exit 1
          fi
          if [ "$ran" -eq 0 ]; then
            echo "Scoped to [$SCOPE_SKILLS] — no matching gate scenario; nothing to run (clean pass)."
          fi
          exit "$fail"

      # Post the gate results to the job summary always, and to the PR as a
      # sticky comment on pull_request runs. `always()` so a failing gate still
      # reports which scenario/model regressed instead of just a red check.
      - name: Report gate results
        if: always() && steps.scope.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          md="$(pnpm exec tsx internal/skill-gate-eval/src/report.ts "$MUGGLE_BRAIN_DIR")"
          printf '%s\n' "$md" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            marker='<!-- muggle-skill-eval:gate -->'
            body="$(printf '%s\n%s' "$marker" "$md")"
            pr='${{ github.event.pull_request.number }}'
            repo='${{ github.repository }}'
            cid="$(gh api "repos/$repo/issues/$pr/comments" --paginate --jq "map(select(.body|startswith(\"$marker\")))|last|.id" 2>/dev/null || true)"
            if [ -n "${cid:-}" ] && [ "$cid" != "null" ]; then
              gh api -X PATCH "repos/$repo/issues/comments/$cid" -f body="$body" >/dev/null
            else
              gh api -X POST "repos/$repo/issues/$pr/comments" -f body="$body" >/dev/null
            fi
          fi

  agent-gate-eval:
    runs-on: ubuntu-latest
    # LLM-driven like skill-gate-eval, but hermetic (scripted Bash, no brain
    # checkout) and small: 2 agents × 3 scenarios × AGENT_RUNS reps.
    timeout-minutes: 90
    env:
      AGENT_RUNS: ${{ inputs.agent_runs || '5' }}
      AGENT_CONCURRENCY: ${{ inputs.agent_concurrency || '8' }}
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/.cc-config
    steps:
      - name: Require secrets
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          : "${CLAUDE_CODE_OAUTH_TOKEN:?set the CLAUDE_CODE_OAUTH_TOKEN repo secret (run \`claude setup-token\`) to run skill evals}"

      - name: Checkout works
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # An agent's behavior shifts when its definition, the eval harness, or the
      # stage files it Reads at runtime change. Anything else (docs, runtime) is
      # out of scope on a PR; nightly/dispatch/run-full-eval always run full.
      - name: Determine scope
        id: scope
        env:
          RUN_FULL_EVAL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-eval') }}
        run: |
          set -euo pipefail
          if [ "$RUN_FULL_EVAL" = "true" ] || [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Full agent-gate sweep"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base...HEAD" -- \
               plugin/agents/ internal/agent-gate-eval/ \
               plugin/skills/muggle-test-prepare/ plugin/skills/muggle-pr-visual-walkthrough/ \
             | grep -q .; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Agent-relevant changes detected — running agent-gate eval."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No agent-relevant changes — agent-gate eval not required."
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        if: steps.scope.outputs.should_run == 'true'
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        if: steps.scope.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code CLI
        if: steps.scope.outputs.should_run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve subscription auth
        if: steps.scope.outputs.should_run == 'true'
        uses: ./.github/actions/resolve-claude-token
        with:
          primary-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          fallback-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}

      - name: Run agent-gate evals (every scenario file)
        if: steps.scope.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          export CLAUDE_CODE_EXECUTABLE="$(command -v claude)"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          fail=0
          total=0
          for scenarios in internal/agent-gate-eval/scenarios/*.json; do
            case "$scenarios" in *.results.json) continue ;; esac
            total=$((total + 1))
            agent="$(basename "$scenarios" .json)"
            echo "::group::agent=$agent runs=$AGENT_RUNS"
            if pnpm exec tsx internal/agent-gate-eval/src/run.ts \
                 --agent "$agent" --runs "$AGENT_RUNS" \
                 --concurrency "$AGENT_CONCURRENCY"; then
              echo "PASS $agent"
            else
              echo "FAIL $agent"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$total" -eq 0 ]; then
            echo "No scenario files under internal/agent-gate-eval/scenarios" >&2
            exit 1
          fi
          exit "$fail"

      # Post agent results to the job summary always, and to the PR as a sticky
      # comment on pull_request runs — same pattern as the gate report.
      - name: Report agent results
        if: always() && steps.scope.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          md="### 🤖 Agent gate eval"$'\n'
          for results in internal/agent-gate-eval/scenarios/*.results.json; do
            [ -f "$results" ] || continue
            md+="$(node -e '
              // require() would treat this relative glob path as a package name
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const lines = [`\n**${r.agent}** — model \`${r.model}\` (pin: ${r.modelAlias}), ${r.runsPerScenario} runs/scenario, threshold ${r.passThreshold}`];
              lines.push("", "| Scenario | Pass rate | |", "| --- | --- | --- |");
              for (const s of r.scenarios) {
                lines.push(`| ${s.name} | ${s.passes}/${s.runs} | ${s.passed ? "✅" : "❌"} |`);
              }
              process.stdout.write(lines.join("\n"));
            ' "$results")"$'\n'
          done
          printf '%s\n' "$md" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            marker='<!-- muggle-skill-eval:agent-gate -->'
            body="$(printf '%s\n%s' "$marker" "$md")"
            pr='${{ github.event.pull_request.number }}'
            repo='${{ github.repository }}'
            cid="$(gh api "repos/$repo/issues/$pr/comments" --paginate --jq "map(select(.body|startswith(\"$marker\")))|last|.id" 2>/dev/null || true)"
            if [ -n "${cid:-}" ] && [ "$cid" != "null" ]; then
              gh api -X PATCH "repos/$repo/issues/comments/$cid" -f body="$body" >/dev/null
            else
              gh api -X POST "repos/$repo/issues/$pr/comments" -f body="$body" >/dev/null
            fi
          fi

  skill-routing-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ROUTING_RUNS: ${{ inputs.routing_runs || '3' }}
      # A scoped run measures one chunk, so it can afford a wider majority
      # vote than the 391-query sweep: this is what damps the per-query flips
      # that used to decide a PR's verdict.
      ROUTING_RUNS_SCOPED: ${{ inputs.routing_runs_scoped || '5' }}
      # Safe above the old default of 3 now that router_eval retries throttled
      # runs with a pool-wide backoff instead of scoring them as `none`.
      ROUTING_WORKERS: ${{ inputs.routing_workers || '12' }}
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/.cc-config
      CLEAN_CWD: ${{ github.workspace }}/.clean-cwd
      BASELINE_CANDIDATE: ${{ github.workspace }}/internal/skill-routing-eval/reports/run/recall-baseline.candidate.json
    steps:
      - name: Checkout works
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # On a PR, only the touched skills are evaluated (full sweep is nightly).
      # When no skill description changed, the job has nothing to gate and the
      # remaining steps are skipped — the required check still goes green.
      - name: Determine scope
        id: scope
        env:
          RUN_FULL_EVAL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-eval') }}
        run: |
          set -euo pipefail
          # The run-full-eval label runs the full 391-query sweep on any PR, even
          # one that changed no skill description (which the detection below skips).
          if [ "$RUN_FULL_EVAL" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "skills=" >> "$GITHUB_OUTPUT"
            echo "Full routing sweep (run-full-eval label)"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "skills=" >> "$GITHUB_OUTPUT"
            echo "Full routing sweep (event: ${{ github.event_name }})"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          # Routing depends only on a skill's frontmatter (`name` + `description`)
          # — the body (gate contracts, procedure) never reaches the router. So
          # compare just the frontmatter block, minus `model:`, between base and
          # head: a `model:`-only or body-only change leaves it identical and is
          # skipped. This is what stops a gate-body edit needlessly running (and
          # flaking) the routing eval; a description/name change still runs it.
          fm() { tr -d '\r' | awk 'NR==1 && $0=="---"{f=1;next} f&&$0=="---"{exit} f{print}' | grep -vE '^model:[[:space:]]'; }
          relevant=""
          for s in $(git diff --name-only "$base...HEAD" -- 'plugin/skills/*/SKILL.md' | awk -F/ '{print $3}' | sort -u); do
            before="$(git show "$base:plugin/skills/$s/SKILL.md" 2>/dev/null | fm || true)"
            after="$(git show "HEAD:plugin/skills/$s/SKILL.md" 2>/dev/null | fm || true)"
            if [ "$before" != "$after" ]; then
              relevant="${relevant:+$relevant,}$s"
            fi
          done
          if [ -z "$relevant" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "No routing-relevant frontmatter changes (model:-only / body-only) — routing eval not required."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "skills=$relevant" >> "$GITHUB_OUTPUT"
            echo "Routing-relevant skills: $relevant"
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Python
        if: steps.scope.outputs.should_run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Claude Code CLI
        if: steps.scope.outputs.should_run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Resolved ahead of the plugin install so every `claude` call in this job,
      # marketplace and probe alike, runs on the token that actually works.
      - name: Resolve subscription auth
        if: steps.scope.outputs.should_run == 'true'
        uses: ./.github/actions/resolve-claude-token
        with:
          primary-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          fallback-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}

      # Install the plugin from THIS checkout (not GitHub master) so the eval
      # tests the PR's skill descriptions. Fresh CLAUDE_CONFIG_DIR + a clean cwd
      # keep the repo's own .claude settings/skills from competing.
      - name: Install muggle plugin from this checkout
        if: steps.scope.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$CLAUDE_CONFIG_DIR" "$CLEAN_CWD"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install muggleai@muggle-works
          claude plugin list
          claude plugin list | grep -Fq "muggleai@muggle-works" \
            || { echo "muggle plugin failed to install/enable" >&2; exit 1; }

      # The eval cwd used to be an empty dir, which made every change-driven
      # query ("test my changes", "validate what I've been working on") a
      # trick question: the model inspects, finds no repo and no diff, and
      # correctly answers that there is nothing to test — scoring `none` no
      # matter how the skill is described. Seed a small web app with real
      # uncommitted changes so those queries have a referent. It stays isolated
      # from this repo, so the plugin is still the only skill source.
      - name: Seed the eval cwd with a changed web app
        if: steps.scope.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$CLEAN_CWD/src"
          cd "$CLEAN_CWD"
          git init -q
          git config user.email eval@example.com
          git config user.name "routing eval"
          cat > package.json <<'JSON'
          { "name": "shop", "version": "1.0.0", "scripts": { "dev": "vite" } }
          JSON
          cat > index.html <<'HTML'
          <!doctype html><title>Shop</title><div id="app"></div>
          <form id="login"><input name="email"><input name="password" type="password"><button>Sign in</button></form>
          HTML
          cat > src/checkout.js <<'JS'
          export function total(items) { return items.reduce((n, i) => n + i.price, 0); }
          JS
          cat > src/login.js <<'JS'
          export function submit(form) { return fetch("/api/login", { method: "POST", body: new FormData(form) }); }
          JS
          git add -A
          git commit -qm "shop: checkout and login"
          # Uncommitted work — this is what "my changes" refers to.
          cat > src/checkout.js <<'JS'
          export function total(items, coupon) {
            const sum = items.reduce((n, i) => n + i.price, 0);
            return coupon ? sum * (1 - coupon.rate) : sum;
          }
          JS
          cat > src/login.js <<'JS'
          export function submit(form) {
            const body = new FormData(form);
            return fetch("/api/login", { method: "POST", body, credentials: "include" });
          }
          JS
          git status --short


      - name: Preflight — confirm the plugin actually routes
        id: preflight
        if: steps.scope.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          # Routing is probabilistic, so one probe is not evidence the harness is
          # broken — a single unlucky `none` used to fail a 180-minute job and
          # block every PR that touches a skill description. Probe up to
          # PREFLIGHT_ATTEMPTS times and pass on the first concrete route.
          #
          # A pass that needed more than one attempt is not reported as a clean
          # pass: the probe is unstable, and hiding that behind a green check is
          # what lets flakiness rot silently. It does not block — it surfaces, as
          # a workflow warning and a banner on the PR's routing comment.
          route=""
          used=0
          for attempt in $(seq 1 "${PREFLIGHT_ATTEMPTS:-3}"); do
            used=$attempt
            route="$(python internal/skill-routing-eval/router_eval.py \
              --probe 'run a muggle E2E acceptance test on my web app' --repo-root "$CLEAN_CWD")"
            echo "preflight attempt=$attempt route=$route"
            case "$route" in
              none|""|ERROR|TIMEOUT|THROTTLED) ;;
              *)
                {
                  echo "route=$route"
                  echo "attempts_used=$used"
                  echo "unstable=$([ "$used" -gt 1 ] && echo true || echo false)"
                } >> "$GITHUB_OUTPUT"
                if [ "$used" -gt 1 ]; then
                  echo "::warning title=Routing preflight inconsistently passed::Routed as '$route' only on attempt $used of ${PREFLIGHT_ATTEMPTS:-3} — the probe is unstable. Not blocking, but the routing signal on this run is weaker than a clean pass."
                  echo "plugin loaded; routing INCONSISTENTLY passed (route=$route on attempt $used)"
                else
                  echo "plugin loaded; routing works (route=$route)"
                fi
                exit 0 ;;
            esac
          done
          { echo "route=$route"; echo "attempts_used=$used"; echo "unstable=true"; } >> "$GITHUB_OUTPUT"
          echo "Preflight failed: '$route' on all ${PREFLIGHT_ATTEMPTS:-3} attempts. Plugin not loaded, auth missing, or probe session broken." >&2
          exit 1

      - name: Run routing eval
        if: steps.scope.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          # Both modes gate against internal/skill-routing-eval/recall-baseline.json: a
          # skill fails when it lands below its own recorded recall by more than
          # routing noise, or when it collapses toward zero. An absolute bar
          # cannot work here: routing is stochastic and master itself sits at
          # 86%, so any bar is either unreachable or meaningless.
          # Only the full sweep measures every skill, so only it can propose the
          # next baseline; the candidate is published for a human to review.
          if [ "${{ steps.scope.outputs.full }}" = "true" ]; then
            python internal/skill-routing-eval/run.py \
              --all --runs "$ROUTING_RUNS" --workers "$ROUTING_WORKERS" \
              --repo-root "$CLEAN_CWD" --gate \
              --record-baseline "$BASELINE_CANDIDATE"
          else
            python internal/skill-routing-eval/run.py \
              --skills "${{ steps.scope.outputs.skills }}" \
              --runs "$ROUTING_RUNS_SCOPED" --workers "$ROUTING_WORKERS" \
              --repo-root "$CLEAN_CWD" --gate
          fi

      # Only a human promotes a measurement to the baseline: the sweep publishes
      # its tallies as an artifact and stops there.
      - name: Upload baseline candidate
        if: always() && steps.scope.outputs.should_run == 'true' && steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: routing-recall-baseline
          path: ${{ env.BASELINE_CANDIDATE }}
          if-no-files-found: warn

      # Post the routing report (reports/run/combined.md) to the job summary and,
      # on a PR, a sticky comment. `always()` so a flaked/failed sweep still
      # reports rather than leaving a bare red check.
      - name: Report routing results
        if: always() && steps.scope.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          f="internal/skill-routing-eval/reports/run/combined.md"
          if [ -f "$f" ]; then
            md="$(printf '### 🧭 Skill routing eval\n\n%s' "$(head -c 60000 "$f")")"
          else
            md="$(printf '### 🧭 Skill routing eval\n\n_No routing report produced — the run failed before writing combined.md (often the MCP-disconnect / subscription-limit flake; re-run)._')"
          fi
          # An inconsistent preflight is not a failure, but the owner must see it:
          # a green check that needed three tries is a signal, not a pass.
          if [ "${{ steps.preflight.outputs.unstable }}" = "true" ] && [ -n "${{ steps.preflight.outputs.route }}" ]; then
            banner="$(printf '> ⚠️ **Routing preflight inconsistently passed** — routed only on attempt %s of %s (`%s`). Not blocking, but the routing signal on this run is weaker than a clean pass.\n' \
              "${{ steps.preflight.outputs.attempts_used }}" "${PREFLIGHT_ATTEMPTS:-3}" "${{ steps.preflight.outputs.route }}")"
            md="$(printf '%s\n%s' "$banner" "$md")"
          fi
          printf '%s\n' "$md" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            marker='<!-- muggle-skill-eval:routing -->'
            body="$(printf '%s\n%s' "$marker" "$md")"
            pr='${{ github.event.pull_request.number }}'
            repo='${{ github.repository }}'
            cid="$(gh api "repos/$repo/issues/$pr/comments" --paginate --jq "map(select(.body|startswith(\"$marker\")))|last|.id" 2>/dev/null || true)"
            if [ -n "${cid:-}" ] && [ "$cid" != "null" ]; then
              gh api -X PATCH "repos/$repo/issues/comments/$cid" -f body="$body" >/dev/null
            else
              gh api -X POST "repos/$repo/issues/$pr/comments" -f body="$body" >/dev/null
            fi
          fi
