name: CI

on:
  push:
    branches: [master]
    # docs/ and ops/ are unreachable from every job below: nothing in src/,
    # test/, or scripts/ references them, eslint lints only ts/mts/js/mjs/cjs,
    # and neither ships in package.json `files`. internal/ and scripts/ look
    # equally inert but are not — internal/**/*.test.ts matches the vitest
    # include and src/test/scripts/ covers scripts/. Actions has no YAML
    # anchors, so pull_request repeats the list.
    paths-ignore:
      - "docs/**"
      - "ops/**"
      - "README.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "ops/**"
      - "README.md"

concurrency:
  # Superseded PR pushes are dead work. Master runs are per-commit history, so
  # they always run to completion.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint:check

      # Peak-RSS report around the suite — surfaces a memory regression before it
      # OOMs a runner. Report-only for now; set MEM_BUDGET_KB (+ MEM_GATE_BLOCKING=1)
      # to enforce a ceiling once baselines are known. See scripts/mem-gate.sh.
      - name: Run tests (memory-gated)
        run: bash scripts/mem-gate.sh pnpm test

      # Every hook within 1 s and every firing within 2 s, timed alone so the
      # suite's own process starts are not what gets measured.
      - name: Run hook runtime budget
        run: pnpm test:hook-runtime

      - name: Build
        run: pnpm run build

  # Guards the Python eval harness (skill-routing-eval). Pure stdlib unittest,
  # no Claude calls, so it runs on every PR without the LLM evals' flake/cost.
  harness-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run harness unit tests
        run: python -m unittest discover -s internal/skill-routing-eval -p "test_*.py" -v

  # Enforces the one-way skill dependency rule (plugin/skills/CLAUDE.md).
  # Zero-dep Node script, so no install step — catches reverse dependencies
  # in PRs from any agent, including ones the local PreToolUse hook never sees.
  skill-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check skill dependency direction
        run: node scripts/check-skill-deps.mjs

  # Enforces the signing rule (plugin/skills/_shared/vcs/post-signature.md).
  # An unsigned post still succeeds, so nothing at runtime reveals the drift —
  # only this job does. Zero-dep Node script, so no install step.
  post-signatures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check posted bodies are signed
        run: node scripts/check-post-signatures.mjs

  # Type check with different TypeScript versions
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        typescript: ["5.5", "5.6", "5.7"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install TypeScript ${{ matrix.typescript }}
        run: pnpm add -Dw typescript@${{ matrix.typescript }}

      - name: Type check
        run: npx tsc --noEmit

  # Test on multiple Node.js versions
  node-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "23"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  # Test on multiple platforms
  platform-compat:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # Hooks run on the user's OS, so the budget holds on each one.
      - name: Run hook runtime budget
        run: pnpm test:hook-runtime

      - name: Build
        run: pnpm run build

  # The plugin under the real Codex CLI (src/test/codex/codex-live.test.ts):
  # installed from this checkout with Codex's own plugin commands, its MCP
  # server started by the plugin's own command, its hooks fired by Codex
  # itself, all against a scripted model — deterministic and credential-free.
  # Codex reports a failed hook to no one, so nothing else would notice one;
  # Windows is here because that is where the hook commands differ. Pinned so a
  # Codex release that changes hook, skill or MCP behavior arrives as a
  # deliberate bump rather than a red master.
  codex-compat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CODEX_CLI_VERSION: "0.163.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The routing eval's Codex harness is Python; its live test drives it here.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Codex CLI
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/codex-cli" "@openai/codex@${CODEX_CLI_VERSION}"
          codex_bin="$RUNNER_TEMP/codex-cli/node_modules/@openai/codex/bin/codex.js"
          node "$codex_bin" --version
          echo "CODEX_BIN=$codex_bin" >> "$GITHUB_ENV"

      - name: Run the plugin under Codex
        env:
          MUGGLE_REQUIRE_CODEX_LIVE: "1"
        run: pnpm run test:codex

  # Verify plugin manifests and compatibility contracts
  verify-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify plugin manifests
        run: pnpm run verify:plugin

      - name: Verify compatibility contracts
        run: pnpm run verify:contracts

      - name: Smoke-test the built CLI
        run: pnpm run smoke:cli

  # Every green master build publishes a staging pre-release, so the staging
  # channel always reflects what is on master rather than whatever someone last
  # dispatched by hand.
  #
  # Dispatches the publish workflow rather than triggering it on `workflow_run`:
  # that workflow resolves its channel from `inputs.channel || 'production'` in
  # three places, so a trigger carrying no inputs would silently resolve to
  # production and move the `latest` dist-tag. Dispatching states the channel
  # outright and leaves that logic untouched.
  staging-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - lint-and-test
      - harness-unit-tests
      - skill-deps
      - post-signatures
      - typecheck
      - node-compat
      - platform-compat
      - codex-compat
      - verify-compatibility
    permissions:
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish a staging pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-works-to-npm.yml \
            --ref master \
            -f channel=staging
